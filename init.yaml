---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homy-stack
  namespace: cozy-public
spec:
  interval: 1m0s
  ref:
    branch: v2
  timeout: 60s
  url: https://github.com/homystack/homy-stack.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homy-stack
  namespace: cozy-system
spec:
  interval: 5m
  targetNamespace: cozy-system
  chart:
    spec:
      chart: ./packages/core/platform
      sourceRef:
        kind: GitRepository
        name: homy-stack
        namespace: cozy-public
      reconcileStrategy: Revision
